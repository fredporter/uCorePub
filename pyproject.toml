[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucore-publish"
version = "0.2.0"
description = "Clean edition compilation, offline static export, and multi-target publishing for uCore"
authors = [{name = "", email = ""}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.urls]
"Homepage" = "https://example.com/udos-publishing"
"Bug Tracker" = "https://github.com/example/udos-publishing/issues"

[tool.setuptools.packages.find]
include = ["udos_publishing*"]